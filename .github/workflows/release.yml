name: Build release archive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          INTEGRATION_VERSION="$(python3 -c "import json;print(json.load(open('custom_components/imou_connect/manifest.json'))['version'])")"
          echo "integration=$INTEGRATION_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build integration archive
        run: |
          mkdir -p dist
          zip -r "dist/imou_connect-custom-component-${{ steps.version.outputs.integration }}.zip" \
            custom_components/imou_connect -x '*/__pycache__/*' '*.pyc'

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imou-connect-archive
          path: dist/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/* --clobber