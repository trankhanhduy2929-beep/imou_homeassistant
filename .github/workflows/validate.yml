name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  integration-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile integration and add-on sources
        run: python3 -m compileall -q custom_components addons
      - name: Lint with Ruff
        run: |
          python3 -m pip install --quiet ruff
          ruff check --isolated --no-cache --select E4,E7,E9,F custom_components addons