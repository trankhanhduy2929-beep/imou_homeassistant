name: Imou Life Bridge
version: "1.0.31"
slug: imou_life_bridge
description: Đăng nhập Imou Life, tạo entity qua MQTT Discovery và nhận sự kiện realtime
url: https://github.com/trankhanhduy2929-beep/imou_homeassistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
timeout: 20
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:cctv
panel_title: Imou Life
panel_admin: true
backup: cold
services:
  - mqtt:need
options:
  account: ""
  password: ""
  poll_interval: 30
  request_timeout: 15
  max_properties: 1000
  snapshot_interval: 300
  event_images: true
  log_level: INFO
schema:
  account: str
  password: password
  poll_interval: int(15,300)
  request_timeout: int(5,60)
  max_properties: int(10,2000)
  snapshot_interval: int(0,3600)
  event_images: bool
  log_level: list(INFO|DEBUG|WARNING|ERROR)